# .github/workflows/release.yml
#
# 六平台发布流水线：linux/windows/macos × amd64/arm64
#
# 设计要点（与 T6 事实清单一致）：
# 1. runner 标签都是本轮实测可用的：
#    ubuntu-24.04 / ubuntu-24.04-arm / windows-latest / windows-11-arm / macos-26
#    注意：macOS 13 的镜像已不存在，macOS 14 的镜像自 2026-11-02 起从 Actions 退役，
#    两者都不能出现在 runner 标签里（详情见 T6 事实清单）。
#    darwin/amd64 采用「在 macos-26(arm64) 上 GOARCH=amd64 交叉」的保守方案；
#    备选是改用 macos-26-intel（标准 x64 镜像，未验证公共仓库是否需额外开通）。
# 2. 构建与发布分离：六个 build 作业只 upload-artifact；
#    由单独的 release 作业统一下载后调一次 action-gh-release。
#    六个作业并发创建同一个 Release 会互相踩（422 already_exists），单点上传没有这个问题。
# 3. 构建优先走 wails3（build/Taskfile.yml 存在时），否则走 scripts/build.sh 纯 Go 路径。
#    两条路径产出都落到 bin/，打包统一交给 scripts/package.sh。
# 4. 不单独跑 generate bindings（wails3 build 的 Taskfile 依赖链里已有）；
#    不把 doctor 当门禁（它只做本机自检）。
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: hongguo-pc
  # 钉死版本：wails v3 按周发小版本，@latest 会随机漂移。
  WAILS_VERSION: v3.1.0

jobs:
  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     goos: linux,   goarch: amd64 }
          - { runner: ubuntu-24.04-arm, goos: linux,   goarch: arm64 }
          - { runner: windows-latest,   goos: windows, goarch: amd64 }
          - { runner: windows-11-arm,   goos: windows, goarch: arm64 }
          - { runner: macos-26,         goos: darwin,  goarch: arm64 }
          # darwin/amd64 在 arm64 runner 上交叉编译；若首跑失败，改 runner 为 macos-26-intel
          - { runner: macos-26,         goos: darwin,  goarch: amd64 }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # wails v3 要求 Go 1.26+；runner 预装版本可能是 1.24，绝不能依赖默认值
          go-version: '1.26'
          check-latest: true
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Preflight
        shell: bash
        run: |
          fail=0
          [ -f "cmd/app/main.go" ]      || { echo "::error file=cmd/app/main.go::应用入口 cmd/app 尚未落地（T9），CI 无法构建"; fail=1; }
          [ -f "frontend/package.json" ] || { echo "::error file=frontend/package.json::前端工程尚未落地，CI 无法构建"; fail=1; }
          [ -f "scripts/build.sh" ]      || { echo "::error file=scripts/build.sh::构建脚本缺失"; fail=1; }
          [ -f "scripts/package.sh" ]    || { echo "::error file=scripts/package.sh::打包脚本缺失"; fail=1; }
          [ -f "build/windows/icon.ico" ]          || { echo "::error file=build/windows/icon.ico::图标缺失（scripts/make-icon.ps1 生成并入库）"; fail=1; }
          [ -f "build/windows/wails.exe.manifest" ] || { echo "::error file=build/windows/wails.exe.manifest::manifest 缺失，Windows 产物将无 DPI/UAC 声明"; fail=1; }
          [ -f "build/windows/info.json" ]          || { echo "::error file=build/windows/info.json::info.json 缺失，Windows 产物将无版本信息"; fail=1; }
          echo "go:     $(go version)"
          echo "node:   $(node --version)"
          echo "target: ${GOOS:-unset}/${GOARCH:-unset}"
          [ "$fail" -eq 0 ]
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev libwayland-dev
          # 快速失败：包名或 pkg-config 目标不对时，这里立刻红，而不是等到链接期
          pkg-config --modversion gtk4
          pkg-config --modversion webkitgtk-6.0

      - name: Setup Task
        # wails3 build 会调用 task；arm64 Windows 上若下载不到可用二进制，
        # 后续会自动退回 scripts/build.sh，因此这里不让它单独把作业搞红。
        continue-on-error: true
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/wails3" version || true

      - name: Build frontend
        shell: bash
        run: |
          cd frontend
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
          test -d dist

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          APP_NAME: ${{ env.APP_NAME }}
          SKIP_FRONTEND_BUILD: '1'
        run: |
          set -euo pipefail
          if [ -f build/Taskfile.yml ] && command -v task >/dev/null 2>&1; then
            echo "::notice::使用 wails3 构建（检测到 build/Taskfile.yml 与 task）"
            if [ "$GOOS" = "darwin" ]; then
              wails3 package GOOS="$GOOS" GOARCH="$GOARCH"
            else
              wails3 build GOOS="$GOOS" GOARCH="$GOARCH"
            fi
          else
            echo "::notice::使用 scripts/build.sh（无 build/Taskfile.yml 或 task 不可用）"
            bash scripts/build.sh
            if [ "$GOOS" = "darwin" ]; then
              bash scripts/build.sh --app
            fi
          fi
          ls -laR bin || true

      # mpv 内核分发（仅 windows/amd64；arm64 无官方 libmpv 构建，应用自动
      # 回退 <video>）。dll 放进打包目录随 zip 分发——libmpv v0.42 shinchiro
      # 构建（下载失败不阻断发版：应用探测不到 dll 自动走回退路径）。
      - name: Fetch libmpv (windows amd64)
        if: matrix.goos == 'windows' && matrix.goarch == 'amd64'
        shell: pwsh
        run: |
          $url = 'https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261107/mpv-dev-x86_64-20261107-git-9028187538.7z'
          $archive = Join-Path $env:RUNNER_TEMP 'mpv-dev.7z'
          try {
            Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRedirection 10
            $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
            if (-not (Test-Path $sevenZip)) { throw '7z.exe not found on runner' }
            & $sevenZip e $archive -obin 'libmpv-2.dll' -y
            if (Test-Path 'bin/libmpv-2.dll') {
              Write-Host "::notice::libmpv-2.dll 已就位（$((Get-Item 'bin/libmpv-2.dll').Length / 1MB -as [int]) MB）"
            } else { throw 'libmpv-2.dll not extracted' }
          } catch {
            Write-Host "::warning::libmpv 下载失败，本包回退 <video> 播放：$($_.Exception.Message)"
          }

      - name: Package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          APP_NAME: ${{ env.APP_NAME }}
        run: bash scripts/package.sh

      # 冒烟校验（docs/rootcause-exe-not-launch.md §9.2）：解压到干净目录后直接启动，
      # 防止「包里缺资源/资源按 CWD 解析」这类缺陷再次静默发布。
      # 只在 windows/amd64 上跑：需要 GUI + WebView2；arm64 runner 的 WebView2 情况未验证。
      - name: Smoke test (clean dir launch)
        if: matrix.goos == 'windows' && matrix.goarch == 'amd64'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'smoke-clean'
          if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
          New-Item -ItemType Directory -Force $dir | Out-Null
          Expand-Archive -Path 'dist/hongguo-pc_windows_amd64.zip' -DestinationPath $dir -Force
          $exe = Join-Path $dir 'hongguo-pc.exe'
          $p = Start-Process -FilePath $exe -WorkingDirectory $dir -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            $log = Join-Path $env:LOCALAPPDATA 'hongguo-pc\startup-error.log'
            if (Test-Path $log) {
              Write-Host '--- startup-error.log ---'
              Get-Content $log
            } else {
              Write-Host 'startup-error.log 不存在（进程在写日志前就退出了？）'
            }
            throw "smoke test failed: 进程 8 秒内退出 exit=$($p.ExitCode)"
          }
          Write-Host "smoke ok: 进程存活 MainWindowTitle='$($p.MainWindowTitle)'"
          Stop-Process -Id $p.Id -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          ls -la
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          # 发布前把「更新说明（可直接复制给用户）」一节的分类要点填进 body 里的
          # 对应代码块（新功能/问题修复/性能/文档）；发版人在打 tag 前改这里。
          body: |
            ## 更新说明（可直接复制给用户）

            ```
            **红果短剧播放器 ${GITHUB_REF_NAME}**

            （发版前按分类填写本节；此代码块可原样复制进聊天/公告。）

            **新功能**
            -
            ```

            ## 下载

            | 平台 | 文件 |
            |---|---|
            | Windows x64 | `hongguo-pc_windows_amd64.zip` |
            | Windows ARM64 | `hongguo-pc_windows_arm64.zip` |
            | Linux x64 | `hongguo-pc_linux_amd64.tar.gz` |
            | Linux ARM64 | `hongguo-pc_linux_arm64.tar.gz` |
            | macOS Apple Silicon | `hongguo-pc_macos_arm64.zip` |
            | macOS Intel | `hongguo-pc_macos_amd64.zip` |

            校验：`sha256sum -c SHA256SUMS.txt`（macOS: `shasum -a 256 -c SHA256SUMS.txt`，或 Windows: `certutil -hashfile <file> SHA256` 后手工比对）。

            ## 运行时要求

            - **Windows 10/11**：需要 WebView2 Runtime。Windows 11 通常已自带；缺失时请按
              [Microsoft WebView2 官方文档](https://learn.microsoft.com/microsoft-edge/webview2/) 安装。
            - **Linux**：需要 GTK4 + WebKitGTK 6.0 运行时
              （Debian/Ubuntu: `libgtk-4-1 libwebkitgtk-6.0-4`）。二进制在 Ubuntu 24.04 上构建，
              更老的发行版未验证。
            - **macOS**：需要 macOS 11 或更高。**发行包未签名、未公证**，首次打开会被 Gatekeeper
              拦截（提示无法验证开发者）。这是预期行为，说明见 README。
            - **所有平台**：ffmpeg 不随包分发，需要用户自备并自行配置路径。
              仓库不附带、不下载、也不再分发 ffmpeg。

            ## 免责声明

            本项目仅供个人学习与技术研究使用。详情见 README 的「免责声明」一节。
